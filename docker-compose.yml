services:
  eddie-ebpf:
    build:
      context: .
      target: ebpf
    privileged: true
    pid: host
    volumes:
      - ebpf-sock:/run/eddie-ebpf
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /sys/fs/bpf:/sys/fs/bpf:ro
    mem_limit: 128m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "test", "-S", "/run/eddie-ebpf/events.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  eddie-personal:
    build:
      context: .
      target: app
    env_file: .env.docker
    environment:
      - DOCKER_ENV=true
      - EBPF_ENABLED=true
      - EBPF_SOCKET_PATH=/run/eddie-ebpf/events.sock
      - DASHBOARD_PORT=3000
      - DASHBOARD_HOST=0.0.0.0
    volumes:
      - /home/na/brain-vault:/brain-vault:rw
      - /home/na/.claude:/home/eddie/.claude:rw
      - /home/na/eddie/data:/app/data:rw
      - ebpf-sock:/run/eddie-ebpf:ro
      - eddie-claude-home:/home/eddie/.eddie-docker-home
    ports:
      - "3001:3000"
      - "8444:8443"
    mem_limit: 2g
    mem_reservation: 512m
    restart: unless-stopped
    depends_on:
      eddie-ebpf:
        condition: service_healthy
        required: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  eddie-production:
    build:
      context: .
      target: app
    env_file: .env.docker.prod
    environment:
      - DOCKER_ENV=true
      - DASHBOARD_PORT=3000
    volumes:
      - eddie-prod-brainvault:/brain-vault
      - eddie-prod-data:/app/data
      - eddie-prod-claude-home:/home/eddie/.eddie-docker-home
    ports:
      - "3002:3000"
    mem_limit: 1g
    restart: unless-stopped
    profiles:
      - prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ebpf-sock:
  eddie-claude-home:
  eddie-prod-brainvault:
  eddie-prod-data:
  eddie-prod-claude-home:
