<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDDIE Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; }
    #header { padding: 16px 24px; background: #161b22; border-bottom: 1px solid #30363d; font-weight: 600; font-size: 18px; }
    #messages { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; font-size: 14px; }
    .user { background: #1f6feb; color: white; align-self: flex-end; }
    .assistant { background: #21262d; border: 1px solid #30363d; align-self: flex-start; }
    .assistant.streaming::after { content: '\25CB'; animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    #input-area { padding: 16px 24px; background: #161b22; border-top: 1px solid #30363d; display: flex; gap: 12px; }
    #input { flex: 1; padding: 12px 16px; background: #21262d; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; font-size: 14px; resize: none; min-height: 44px; max-height: 200px; }
    #input:focus { outline: none; border-color: #388bfd; }
    #send { padding: 12px 20px; background: #1f6feb; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
    #send:hover { background: #388bfd; }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
    .meta { font-size: 11px; opacity: 0.5; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="header">EDDIE</div>
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="input" placeholder="Message EDDIE..." rows="1"></textarea>
    <button id="send">Send</button>
  </div>
  <script src="/chat.js"></script>
</body>
</html>
