<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDDIE Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>EDDIE</h1>
    <span id="status" class="status offline">offline</span>
  </header>

  <main>
    <section id="system-panel" class="panel">
      <h2>System Status</h2>
      <div class="stats-grid">
        <div class="stat">
          <span class="stat-value" id="uptime">--</span>
          <span class="stat-label">Uptime</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="memory-status">--</span>
          <span class="stat-label">Memory</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="total-convos">--</span>
          <span class="stat-label">Conversations</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="total-facts">--</span>
          <span class="stat-label">Facts</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="total-comms">--</span>
          <span class="stat-label">Communications</span>
        </div>
      </div>
    </section>

    <section id="conversations-panel" class="panel">
      <h2>Recent Conversations</h2>
      <div id="conversations-list" class="scrollable"></div>
    </section>

    <section id="facts-panel" class="panel">
      <h2>Memory / Facts</h2>
      <div id="facts-list" class="scrollable"></div>
    </section>

    <section id="feed-panel" class="panel">
      <h2>Live Feed</h2>
      <div id="feed-list" class="scrollable"></div>
    </section>

    <section id="heartbeat-panel" class="panel">
      <h2>Heartbeat History</h2>
      <div id="heartbeat-list" class="scrollable"></div>
    </section>

    <section id="cron-panel" class="panel">
      <h2>Cron Jobs</h2>
      <div id="cron-list" class="scrollable"></div>
    </section>

    <section id="jobs-panel" class="panel">
      <h2>Active Jobs</h2>
      <div id="jobs-list" class="scrollable"></div>
    </section>

    <section id="metrics-panel" class="panel">
      <h2>System Metrics</h2>
      <div class="stats-grid" id="metrics-grid">
        <div class="stat">
          <span class="stat-value" id="mem-use">--</span>
          <span class="stat-label">Memory</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="cpu-load">--</span>
          <span class="stat-label">CPU Load</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="disk-use">--</span>
          <span class="stat-label">Disk</span>
        </div>
      </div>
    </section>

    <section id="cost-panel" class="panel">
      <h2>Cost (7-Day)</h2>
      <div class="stats-grid">
        <div class="stat">
          <span class="stat-value" id="cost-total">--</span>
          <span class="stat-label">Total Cost</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="cost-input">--</span>
          <span class="stat-label">Input Tokens</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="cost-output">--</span>
          <span class="stat-label">Output Tokens</span>
        </div>
      </div>
      <div id="cost-breakdown" class="scrollable" style="margin-top:8px"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
